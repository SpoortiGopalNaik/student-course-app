global:
  scrape_interval: 5s

scrape_configs:
  # 🟦 Scrape cAdvisor (Container metrics)
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']

  # 🟩 Scrape Node App (ONLY if /metrics exists)
  - job_name: 'student-course-app'
    static_configs:
      - targets: ['student-course-app:3000']
